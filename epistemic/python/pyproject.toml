[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mango-epistemic"
version = "0.1.0"
description = "Mango epistemic engine and isolated sub-agents"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mango_epistemic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
