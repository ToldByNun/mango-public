[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mango-runtime"
version = "0.1.0"
description = "Mango GGUF model runner (llama.cpp via llama-cpp-python)"
requires-python = ">=3.10"
dependencies = [
    "llama-cpp-python>=0.3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mango_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: requires a real GGUF model (MANGO_GGUF_MODEL_PATH)",
]
