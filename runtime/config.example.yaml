# Copy to config.yaml and set model.path to your GGUF file.

model:
  path: ""           # absolute or relative path to .gguf
  n_ctx: 4096        # context window (tokens)
  n_batch: 512       # prompt batch size

hardware:
  n_gpu_layers: 0    # 0 = CPU only, -1 = offload all layers to GPU
  n_threads: 0         # 0 = auto (logical cores)

inference:
  max_tokens: 256
  temperature: 0.7
  top_p: 0.9
  stop: []
