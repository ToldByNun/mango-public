# Copy to config.yaml and set model.path to your GGUF file.

model:
  path: ""           # absolute or relative path to .gguf
  n_ctx: 16384       # context window (tokens); 16GB VRAM + 12B Q4 stays on GPU
  n_batch: 512       # prompt batch size

hardware:
  n_gpu_layers: -1   # 0 = CPU only, -1 = offload all layers to GPU
  n_threads: 0         # 0 = auto (logical cores)

inference:
  max_tokens: 2048
  temperature: 0.1
  top_p: 0.95
  stop: []
